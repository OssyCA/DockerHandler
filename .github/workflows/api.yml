name: api

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "DockerController.slnx"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/api.yml"
  push:
    branches:
      - "master"
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "DockerController.slnx"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore DockerController.slnx
      - name: Build
        run: dotnet build DockerController.slnx --no-restore -c Release
      - name: Test
        run: dotnet test DockerController.slnx --no-build -c Release
      - name: Docker
        run: docker build -t docker-controller:ci .
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes dockcontroller@"$DEPLOY_HOST"
